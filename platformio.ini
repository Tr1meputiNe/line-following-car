; PlatformIO 配置文件
;
; 光电循迹小车大作业
;   主板：Arduino Uno
;   显示：0.96" OLED，SSD1306 驱动，128x64，I2C（A4=SDA / A5=SCL）
;   循迹：红外光电对管 x2，模拟输出接 A0 / A1
;   驱动：MX1508（左轮 D5/D6，右轮 D9/D10，实测确认）
;
; 三个命令，够用了：
;   pio run -e uno -t upload        编译并下载正式程序（src/main.cpp）
;   pio run -e bringup -t upload    编译并下载分步测试程序（src/bringup.cpp）
;   pio device monitor              打开串口监视器（9600）

[platformio]
; ★★★ 环境开关 ★★★
;   uno     = 正式程序（src/main.cpp）      <- 现在用这个
;   bringup = 分步测试程序（src/bringup.cpp）
;   改完要重启 VS Code（或 Cmd+Shift+P -> Developer: Reload Window）才生效
default_envs = uno

[env]
platform = atmelavr
framework = arduino
board = uno
monitor_speed = 9600

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306

; 正式程序：只编译 src/main.cpp
[env:uno]
build_src_filter = +<main.cpp>

; 分步测试程序：只编译 src/bringup.cpp（装车前先用它逐个测试部件）
[env:bringup]
build_src_filter = +<bringup.cpp>
